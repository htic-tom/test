[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-agentic-ai"
version = "0.1.0"
description = "A minimal, tool-using agentic AI project in Python."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Cursor Cloud Agent"}
]

[project.scripts]
simple-agent = "main:main"
